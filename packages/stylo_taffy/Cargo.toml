[package]
# Published as `ps-*` because `stylo_taffy` on crates.io is DioxusLabs'. This
# one is built against `ps-taffy`, so it is a different crate wearing the same
# name. The `[lib]` name below stays `stylo_taffy`, so every path is unchanged.
name = "ps-stylo-taffy"
license = "MIT OR Apache-2.0 OR MPL-2.0"
description = "Interop crate for the stylo and taffy crates"
keywords = ["css", "layout"]
version.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "stylo_taffy"

[dependencies]
taffy = { workspace = true, features = ["float_layout"] }
style = { workspace = true }
style_atoms = { workspace = true }

[features]
default = ["std", "block", "flexbox", "grid"]
std = ["taffy/std"]
block = ["taffy/block_layout"]
flexbox = ["taffy/flexbox"]
grid = ["taffy/grid"]
floats = ["taffy/float_layout"]
